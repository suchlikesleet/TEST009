name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/3d-game-framework-mobile-r9m3wi]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Phones cache JS/CSS hard. Stamp every deploy's file URLs with the commit so
      # a new deploy always loads fresh files, and show the build on the start screen.
      - name: Stamp build version
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$V'#g" src/*.js
          sed -i -e "s#src/main.js\"#src/main.js?v=$V\"#" -e "s#style.css\"#style.css?v=$V\"#" -e "s#<span id=\"build\">dev</span>#<span id=\"build\">$V</span>#" index.html
          grep -n "?v=" index.html src/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
